name: Windows build and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust stable with required components
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release executable
        run: cargo build --release
      - name: Installer fixture checks
        run: .\packaging\test-package.ps1
      - name: Portable ZIP and per-user setup EXE
        run: .\scripts\package.ps1
      - name: Verify packaged install and uninstall without user integration
        run: |
          $portable = Get-ChildItem target/packages -Filter '*-portable.zip' | Select-Object -First 1
          .\packaging\test-package.ps1 -PortableArchive $portable.FullName
      - name: Publish build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bks-term-windows-x64
          path: target/packages/*
          if-no-files-found: error
          retention-days: 30
